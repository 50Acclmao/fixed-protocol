Use port `8082` in the workflow:

```yaml
name: Start app with TryCloudflare

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start app
        run: npm start > app.log 2>&1 &

      - name: Start TryCloudflare tunnel
        run: |
          cloudflared tunnel --url http://localhost:8082 > tunnel.log 2>&1 &
          sleep 5
          grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' tunnel.log || cat tunnel.log

      - name: Keep workflow running
        run: sleep 3600
```
