name: Start app with TryCloudflare

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: cd arras-headless && npm install

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo apt-get update
          sudo dpkg -i cloudflared.deb || sudo apt-get install -f -y

      - name: Start TryCloudflare tunnel first
        run: |
          echo "Starting TryCloudflare tunnel..."

          cloudflared tunnel --url http://127.0.0.1:8082 \
            > tunnel.log 2>&1 &

          echo $! > cloudflared.pid

          echo "Waiting for TryCloudflare URL..."

          for i in {1..30}; do
            URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' tunnel.log | head -n 1)

            if [ -n "$URL" ]; then
              echo ""
              echo "=========================================="
              echo " TRY CLOUDFLARE URL"
              echo " $URL"
              echo "=========================================="
              echo ""
              break
            fi

            sleep 1
          done

          if [ -z "$URL" ]; then
            echo "Failed to obtain TryCloudflare URL."
            cat tunnel.log
            exit 1
          fi

      - name: Start Node server on port 8082
        run: |
          echo "Starting Node server..."

          cd arras-headless
          node server.js > ../app.log 2>&1 &
          echo $! > ../node.pid

          echo "Node PID: $(cat ../node.pid)"
          echo "Node is starting on port 8082..."

      - name: Live logs + monitor
        run: |
          URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' tunnel.log | head -n 1)

          echo ""
          echo "############################################"
          echo "#          SERVER CONNECTION INFO          #"
          echo "############################################"
          echo ""
          echo "TryCloudflare:"
          echo "$URL"
          echo ""
          echo "Node:"
          echo "http://127.0.0.1:8082"
          echo ""
          echo "Tunnel:"
          echo "$URL -> localhost:8082"
          echo ""
          echo "############################################"
          echo ""
          echo "========== LIVE LOGS =========="
          echo ""

          touch app.log tunnel.log

          tail -n 0 -F app.log 2>/dev/null &
          APP_TAIL=$!

          tail -n 0 -F tunnel.log 2>/dev/null &
          TUNNEL_TAIL=$!

          cleanup() {
            kill "$APP_TAIL" "$TUNNEL_TAIL" 2>/dev/null || true
          }

          trap cleanup EXIT

          while true; do
            if ! kill -0 "$(cat node.pid)" 2>/dev/null; then
              echo ""
              echo "========== NODE STOPPED =========="
              cat app.log
              exit 1
            fi

            if ! kill -0 "$(cat cloudflared.pid)" 2>/dev/null; then
              echo ""
              echo "========== CLOUDFLARED STOPPED =========="
              cat tunnel.log
              exit 1
            fi

            sleep 5
          done
